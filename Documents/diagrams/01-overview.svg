<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#67d7c0"/></marker></defs><rect width="100%" height="100%" fill="#0b1525"/><text x="70" y="75" fill="#e7eefb" font-family="Segoe UI, Arial, sans-serif" font-size="37" font-weight="700" text-anchor="start">GrinSight: общая схема</text><text x="70" y="111" fill="#9bb2cf" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">GrinSight: overview</text><rect x="470" y="145" width="460" height="95" rx="18" fill="#192a42" stroke="#385373" stroke-width="2"/><text x="700.0" y="184" fill="#e7eefb" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle">Пользователь / User</text><text x="700.0" y="215" fill="#a8c5e8" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">Баланс · история · платежи / Balance · history · payments</text><line x1="700" y1="240" x2="700" y2="277" stroke="#67d7c0" stroke-width="3" marker-end="url(#a)"/><rect x="470" y="280" width="460" height="105" rx="18" fill="#192a42" stroke="#385373" stroke-width="2"/><text x="700.0" y="319" fill="#e7eefb" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle">Интерфейс GrinSight</text><text x="700.0" y="350" fill="#a8c5e8" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">GrinSight interface</text><line x1="700" y1="385" x2="700" y2="417" stroke="#67d7c0" stroke-width="3" marker-end="url(#a)"/><rect x="470" y="420" width="460" height="105" rx="18" fill="#192a42" stroke="#385373" stroke-width="2"/><text x="700.0" y="459" fill="#e7eefb" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle">Кошелёк / Wallet</text><text x="700.0" y="490" fill="#a8c5e8" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">Поиск монет · создание и подпись платежей</text><text x="700.0" y="521" fill="#c6d4e5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Find coins · create and sign payments</text><line x1="700" y1="525" x2="700" y2="557" stroke="#67d7c0" stroke-width="3" marker-end="url(#a)"/><rect x="470" y="560" width="460" height="105" rx="18" fill="#192a42" stroke="#385373" stroke-width="2"/><text x="700.0" y="599" fill="#e7eefb" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle">Проверяющее ядро</text><text x="700.0" y="630" fill="#a8c5e8" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">Verification engine</text><text x="700.0" y="661" fill="#c6d4e5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Проверяет цепочку и состояние / Verifies chain and state</text><rect x="45" y="560" width="335" height="105" rx="18" fill="#192a42" stroke="#385373" stroke-width="2"/><text x="212.5" y="599" fill="#e7eefb" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle">Локальное состояние</text><text x="212.5" y="630" fill="#a8c5e8" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">Local verified state</text><text x="212.5" y="661" fill="#c6d4e5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Заголовки и outputs / Headers and outputs</text><rect x="1020" y="560" width="335" height="105" rx="18" fill="#192a42" stroke="#385373" stroke-width="2"/><text x="1187.5" y="599" fill="#e7eefb" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle">Сеть Grin / Grin network</text><text x="1187.5" y="630" fill="#a8c5e8" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">Несколько пиров / Multiple peers</text><text x="1187.5" y="661" fill="#c6d4e5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Полные ноды / Full nodes</text><line x1="470" y1="613" x2="382" y2="613" stroke="#67d7c0" stroke-width="3" marker-end="url(#a)"/><line x1="1020" y1="600" x2="932" y2="600" stroke="#67d7c0" stroke-width="3" marker-end="url(#a)"/><path d="M930 470 H1187 V557" fill="none" stroke="#67d7c0" stroke-width="3" marker-end="url(#a)"/><text x="975" y="512" fill="#b9d6ec" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Данные сети / Network data</text><text x="1120" y="450" fill="#b9d6ec" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Транзакция / Transaction</text><rect x="470" y="720" width="460" height="95" rx="18" fill="#192a42" stroke="#385373" stroke-width="2"/><text x="700.0" y="759" fill="#e7eefb" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle">Точка отсчёта / Starting point</text><text x="700.0" y="790" fill="#a8c5e8" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">Checkpoint или проверка от genesis / or verification from genesis</text><line x1="700" y1="720" x2="700" y2="667" stroke="#67d7c0" stroke-width="3" marker-end="url(#a)"/><rect x="45" y="850" width="1310" height="135" rx="18" fill="#112238" stroke="#385373" stroke-width="2"/><text x="70" y="886" fill="#e7eefb" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">RU  Пиры предоставляют данные; GrinSight проверяет их локально, без полной ноды.</text><text x="70" y="922" fill="#a8c5e8" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">EN  Peers provide data; GrinSight verifies it locally, without running a full node.</text><text x="70" y="958" fill="#b8c7da" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">RU / EN  Несколько пиров не гарантируют независимость / Multiple peers do not guarantee independence.</text></svg>