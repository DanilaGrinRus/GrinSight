<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#67d7c0"/></marker></defs><rect width="100%" height="100%" fill="#0b1525"/><text x="70" y="75" fill="#e7eefb" font-family="Segoe UI, Arial, sans-serif" font-size="37" font-weight="700" text-anchor="start">Как проходит платёж</text><text x="70" y="111" fill="#9bb2cf" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">How a payment works</text><rect x="85" y="145" width="1230" height="90" rx="18" fill="#192a42" stroke="#385373" stroke-width="2"/><text x="120" y="183" fill="#67d7c0" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">01</text><text x="185" y="182" fill="#e7eefb" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Пользователь создаёт платёж</text><text x="185" y="213" fill="#a8c5e8" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">The user creates a payment</text><line x1="700" y1="235" x2="700" y2="261" stroke="#67d7c0" stroke-width="3" marker-end="url(#a)"/><rect x="85" y="263" width="1230" height="90" rx="18" fill="#192a42" stroke="#385373" stroke-width="2"/><text x="120" y="301" fill="#67d7c0" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">02</text><text x="185" y="300" fill="#e7eefb" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Кошелёк подписывает транзакцию</text><text x="185" y="331" fill="#a8c5e8" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">The wallet signs the transaction</text><line x1="700" y1="353" x2="700" y2="379" stroke="#67d7c0" stroke-width="3" marker-end="url(#a)"/><rect x="85" y="381" width="1230" height="90" rx="18" fill="#192a42" stroke="#385373" stroke-width="2"/><text x="120" y="419" fill="#67d7c0" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">03</text><text x="185" y="418" fill="#e7eefb" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Пиры получают транзакцию</text><text x="185" y="449" fill="#a8c5e8" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Peers receive the transaction</text><line x1="700" y1="471" x2="700" y2="497" stroke="#67d7c0" stroke-width="3" marker-end="url(#a)"/><rect x="85" y="499" width="1230" height="90" rx="18" fill="#192a42" stroke="#385373" stroke-width="2"/><text x="120" y="537" fill="#67d7c0" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">04</text><text x="185" y="536" fill="#e7eefb" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Транзакция попадает в блок</text><text x="185" y="567" fill="#a8c5e8" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">The transaction is included in a block</text><line x1="700" y1="589" x2="700" y2="615" stroke="#67d7c0" stroke-width="3" marker-end="url(#a)"/><rect x="85" y="617" width="1230" height="90" rx="18" fill="#192a42" stroke="#385373" stroke-width="2"/><text x="120" y="655" fill="#67d7c0" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">05</text><text x="185" y="654" fill="#e7eefb" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">GrinSight проверяет подтверждение</text><text x="185" y="685" fill="#a8c5e8" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">GrinSight verifies the confirmation</text><rect x="85" y="765" width="1230" height="190" rx="18" fill="#112238" stroke="#385373" stroke-width="2"/><text x="110" y="803" fill="#67d7c0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">ПОЯСНЕНИЕ / EXPLANATION</text><text x="110" y="839" fill="#e7eefb" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">RU  Кошелёк подписывает транзакцию и передаёт её пирам. После включения</text><text x="110" y="866" fill="#e7eefb" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">в блок GrinSight проверяет данные и показывает подтверждение.</text><text x="110" y="900" fill="#a8c5e8" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">EN  The wallet signs the transaction and sends it to peers. Once included in a</text><text x="110" y="927" fill="#a8c5e8" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">block, GrinSight verifies the data and displays the confirmation.</text></svg>