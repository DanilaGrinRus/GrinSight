[package]
name = "fly-paycore-bridge"
version = "0.1.0"
edition = "2021"
publish = false
description = "Adapter between the payment core and everything outside it: JSON-RPC 2.0 methods for the UI, ports for external modules"

[dependencies]
fly-paycore-wallet = { path = "../wallet" }
fly-paycore-store = { path = "../store" }
fly-paycore-mailbox = { path = "../mailbox" }
fly-paycore-mailbox-pipe = { path = "../mailbox-pipe" }
fly-paycore-onion-pipe = { path = "../onion-pipe" }
fly-paycore-chain-port = { path = "../chain-port" }
fly-paycore-chain-pipe = { path = "../chain-pipe" }
grin_keychain = { path = "../../vendor/grin/keychain" }
serde_json = "1"
zeroize = "1"

[features]
# Builds a stand-in transport process for the two-process test.
stub = ["fly-paycore-mailbox-pipe/stub", "fly-paycore-chain-pipe/stub", "fly-paycore-onion-pipe/stub"]

[[bin]]
name = "bridge-mailbox-stub"
path = "src/bin/bridge-mailbox-stub.rs"
required-features = ["stub"]

[dev-dependencies]
fly-paycore-store = { path = "../store", features = ["sim"] }
fly-paycore-keys = { path = "../keys" }
grin_core = { path = "../../vendor/grin/core" }
grin_util = { path = "../../vendor/grin/util" }
getrandom = "0.2"
zeroize = "1"
ed25519-dalek = "2"

[patch.crates-io]
scrypt = { path = "../../vendor/scrypt-0.9-research" }

[profile.release]
overflow-checks = true

[workspace]
