[package]
name = "fly-paycore-wallet"
version = "0.1.0"
edition = "2021"
publish = false
description = "Send and receive automata of the payment core (spec rev. 0.4, stages E3-E5, E7)"

[dependencies]
fly-paycore-store = { path = "../store" }
fly-paycore-mailbox = { path = "../mailbox" }
fly-paycore-keys = { path = "../keys" }
grin_keychain = { path = "../../vendor/grin/keychain" }
grin_core = { path = "../../vendor/grin/core" }
grin_util = { path = "../../vendor/grin/util" }
grin_wallet_libwallet = { path = "../../vendor/grin-wallet-upstream/libwallet" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
bech32 = "0.7"
zeroize = "1"
getrandom = "0.2"
ed25519-dalek = "2"
byteorder = "1.3"

[dev-dependencies]
serde = "1"
fly-paycore-store = { path = "../store", features = ["sim"] }

[patch.crates-io]
scrypt = { path = "../../vendor/scrypt-0.9-research" }

[profile.release]
overflow-checks = true

[workspace]
