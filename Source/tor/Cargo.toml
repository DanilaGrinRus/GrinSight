[workspace]
resolver = "2"
members = [
    "grinsight-tor",
    "grinmessenger/crates/glaux-messenger",
    "grinmessenger/crates/glaux-tor-arti",
    "grinmessenger/crates/glaux-gateway",
    "grinmessenger/crates/glaux-messenger-wallet",
]

# Same package metadata as GrinMessenger (the copied crates inherit it).
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
authors = ["DanilaGrinRus <DanilaGrinRus@users.noreply.github.com>"]
repository = "https://github.com/DanilaGrinRus/GrinMessenger"
description = "GrinSight Tor/messenger daemon: grin-wallet Tor foreign API + GrinMessenger envelopes"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# SQLite 3.54.1 inside libsqlite3-sys 0.37 (RUSTSEC-2026-0459); see
# patches/libsqlite3-sys/GRINSIGHT_PATCH.md
[patch.crates-io]
libsqlite3-sys = { path = "patches/libsqlite3-sys" }
