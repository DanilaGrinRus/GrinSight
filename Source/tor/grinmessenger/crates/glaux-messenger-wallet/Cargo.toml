[package]
name = "glaux-messenger-wallet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Wallet integration layer for GrinMessenger: embedded Rust service, seed/identity handling and a local JSON API daemon for Grin wallets"

[features]
default = ["native-tls"]
native-tls = ["glaux-tor-arti/native-tls"]
rustls = ["glaux-tor-arti/rustls"]

[dependencies]
glaux-messenger = { path = "../glaux-messenger" }
glaux-gateway = { path = "../glaux-gateway" }
glaux-tor-arti = { path = "../glaux-tor-arti", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
data-encoding = "2"
getrandom = "0.2"
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1"
chacha20poly1305 = "0.9"

[dev-dependencies]
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
