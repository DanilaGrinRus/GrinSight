[package]
name = "flint-tor-arti"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "In-process Tor (Arti) layer: onion v3 service from an ed25519 seed and HTTP requests over Tor"

[dependencies]
arti-client = { version = "0.43.0", features = ["static", "pt-client", "onion-service-service", "onion-service-client"] }
tor-rtcompat = { version = "0.43.0", features = ["static"] }
tor-hsservice = "0.43.0"
tor-hsrproxy = "0.43.0"
tor-keymgr = "0.43.0"
tor-llcrypto = "0.43.0"
tor-hscrypto = "0.43.0"
fs-mistrust = "0.14.2"
fslock-guard = "0.8"
bech32 = "0.7"
sha3 = "0.10"
data-encoding = "2"
ed25519-dalek = { version = "2", features = ["hazmat"] }
sha2 = "0.10"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
log = "0.4"
thiserror = "2"
