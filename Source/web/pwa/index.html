<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>GrinSight — Web Core</title>
  <style>
    :root { color-scheme: dark; --bg:#101114; --fg:#e9e9ee; --muted:#9aa0aa; --accent:#f5c542; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 32px 20px calc(32px + env(safe-area-inset-bottom)); }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .muted { color: var(--muted); }
    button { background: var(--accent); color:#111; border:0; border-radius:10px; padding:12px 18px; font-weight:650; }
    button:disabled { opacity:.55; }
    pre { white-space: pre-wrap; overflow-wrap:anywhere; background:#171922; border:1px solid #262a36; border-radius:12px; padding:14px; min-height:120px; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:20px 0; }
  </style>
</head>
<body>
<main>
  <h1>GrinSight</h1>
  <p class="muted">Browser core diagnostic · Floonet research build</p>
  <div class="row">
    <button id="run">Проверить Wasm-ядро</button>
    <span id="status" class="muted">не запущено</span>
  </div>
  <pre id="out">Worker ещё не запускался.</pre>
  <p class="muted">Ключи и проверка остаются на устройстве. Это не кошелёк и не подтверждение платежа.</p>
</main>
<script>
  const run = document.getElementById('run');
  const out = document.getElementById('out');
  const status = document.getElementById('status');
  const worker = new Worker('./worker.mjs', { type: 'module' });
  let seq = 0;
  worker.addEventListener('message', (event) => {
    const msg = event.data || {};
    if (msg.id !== seq) return;
    run.disabled = false;
    status.textContent = msg.ok ? 'PASS' : 'FAIL';
    out.textContent = msg.ok ? JSON.stringify(msg.result, null, 2) : ('Ошибка: ' + msg.error);
  });
  worker.addEventListener('error', (event) => {
    run.disabled = false; status.textContent = 'FAIL';
    out.textContent = 'Worker error: ' + (event.message || 'unknown');
  });
  run.addEventListener('click', () => {
    run.disabled = true; status.textContent = 'выполняется…'; seq += 1;
    worker.postMessage({ id: seq, type: 'selftest' });
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
</script>
</body>
</html>
