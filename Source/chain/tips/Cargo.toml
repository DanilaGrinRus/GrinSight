[package]
name = "fly-chain-tips"
version = "0.1.0"
edition = "2021"
publish = false
description = "What named operators of public Grin nodes say the tip of the chain is, asked over HTTPS: the built-in list of operators, one bounded request to a node's own API, the time the answer was given"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
ring = "0.17"
serde_json = "1"

[dev-dependencies]
getrandom = "0.2"

[profile.release]
overflow-checks = true

[workspace]
