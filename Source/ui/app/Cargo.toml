[package]
name = "fly-ui"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "The interface of GrinSight (Slint). Holds no keys: it talks to paycore-host over JSON-RPC"

[lib]
name = "fly_ui"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "fly-ui"
path = "src/main.rs"

[dependencies]
fly-safe-display = { path = "../safe-display" }
fly-host-link = { path = "../host-link" }
qrcodegen = "1.8"
serde_json = "1"
zeroize = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.19", features = ["renderer-software", "software-renderer-systemfonts"] }

# Android: the NativeActivity backend and a GPU renderer, as the probe used;
# the software renderer stays for --snapshot and --scenario.
[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "renderer-femtovg", "renderer-software"] }

[build-dependencies]
slint-build = "1.19"

[workspace]
