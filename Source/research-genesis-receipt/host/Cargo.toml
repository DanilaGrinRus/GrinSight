[package]
name = "research-grin-receipt"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
bincode = "1.3"
tempfile = "3"
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std", "disable-dev-mode"] }

[build-dependencies]
risc0-binfmt = "=3.0.6"
risc0-zkos-v1compat = "=2.2.3"

[target.'cfg(windows)'.dependencies]
risc0-zkvm-platform = { version = "=2.2.3", default-features = false, features = ["export-syscalls"] }

[target.'cfg(windows)'.build-dependencies]
risc0-zkvm-platform = { version = "=2.2.3", default-features = false, features = ["export-syscalls"] }

[workspace]

